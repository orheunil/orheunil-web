name: Sync Fork

on:
  schedule:
    - cron: "0 * * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout fork repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync upstream
        run: |
          git remote add upstream https://github.com/Orheunil-Dev/orheunil-web.git
          git fetch upstream
          git checkout master
          git merge upstream/master --no-edit
          git push origin master
